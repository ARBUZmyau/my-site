<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт 🐈‍⬛</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;

      background:
        linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)),
        url("IMG_20260620_143017_957.jpg")
        center center / cover fixed no-repeat;
    }

    header {
      padding: 30px 15px;
      background: rgba(20, 20, 20, 0.75);
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      font-size: 18px;
    }

    main {
      padding: 40px 20px;
    }

    h2 {
      font-size: 28px;
      text-shadow: 0 2px 8px black;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #4f7cff;
      color: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
    }

    button:hover {
      background: #345de0;
    }

    #text {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 6px black;
    }

    #cat {
      display: none;
      margin-top: 25px;
    }

    #cat img {
      width: 300px;
      max-width: 80%;
      height: auto;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body>

  <header>
    <h1>🐈‍⬛ Мой сайт</h1>
    <p>Добро пожаловать!</p>
  </header>

  <main>
    <h2>Матвей 🐈‍⬛</h2>

    <button onclick="showMatvey()">
      🐈‍⬛ Показать Матвея
    </button>

    <div id="text"></div>

    <div id="cat">
      <img
        src="IMG_20260921_215507_054.jpg"
        alt="Матвей"
      >
    </div>
  </main>

  <script>
    function showMatvey() {
      const cat = document.getElementById("cat");
      const text = document.getElementById("text");

      if (cat.style.display === "block") {
        cat.style.display = "none";
        text.textContent = "";
      } else {
        cat.style.display = "block";
        text.textContent = "Мяу! ❤️ Вот Матвей!";
      }
    }
  </script>

</body>
</html>
